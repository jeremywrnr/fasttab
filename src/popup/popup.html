<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>fasttab</title>
    <style>
      /*INLINE_CSS*/
    </style>
  </head>
  <body>
    <div class="panel" id="panel">
      <div class="bar">
        <input id="q" type="text" autocomplete="off" spellcheck="false" autofocus placeholder="Search tabs" />
      </div>
      <div id="results" hidden>
        <div id="scroller" tabindex="-1">
          <div id="inner"></div>
          <div id="empty" hidden>No matches</div>
        </div>
        <div class="foot">
          <span id="act"></span>
          <a id="shortcut" href="#" hidden></a>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
